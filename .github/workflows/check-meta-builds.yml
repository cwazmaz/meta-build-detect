name: Check Meta Quest builds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_cloudflare:
        description: "Send a test POST to the Cloudflare /admin/build endpoint"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: meta-build-poll
  cancel-in-progress: false

jobs:
  test-cloudflare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_cloudflare }}
    runs-on: ubuntu-latest
    steps:
      - name: Send test POST to Cloudflare
        env:
          WORKER_URL: "https://holy-river-936a.joeswansonfam1.workers.dev/admin/build"
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          # Safe authentication check: an empty build is intentionally rejected
          # by the Worker after auth, before it can modify the stored latest build.
          request = urllib.request.Request(
              os.environ["WORKER_URL"],
              data=json.dumps({}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ.get("ADMIN_TOKEN", ""),
                  "User-Agent": "MetaBuildDetector/1.0 (+https://github.com/cwazmaz/meta-build-detect)"
              },
              method="POST"
          )
          if not os.environ.get("ADMIN_TOKEN", "").strip():
              raise SystemExit("Missing ADMIN_TOKEN repository secret.")
          print("Checking Cloudflare authentication safely (this request will not update the latest build)...")
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print(f"Unexpected response: HTTP {response.status}")
                  print(body[:4000])
                  raise SystemExit("Expected HTTP 400 for the intentionally incomplete test body.")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"Cloudflare response: HTTP {error.code}")
              print(body[:4000] if body else "(empty response body)")
              if error.code == 400 and "version, buildId, and channel are required" in body:
                  print("AUTHENTICATION SUCCESS: Worker accepted the Bearer token; test body was safely rejected.")
              else:
                  raise SystemExit("Authentication check failed or Worker returned an unexpected response.")
          PY

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Meta Platform Utility
        env:
          META_CLI_DOWNLOAD_URL: ${{ secrets.META_CLI_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          if [ -z "$META_CLI_DOWNLOAD_URL" ]; then
            echo "::error::Missing META_CLI_DOWNLOAD_URL repository secret."
            exit 1
          fi
          curl --fail --location --retry 3 "$META_CLI_DOWNLOAD_URL" -o /tmp/ovr-platform-util
          chmod +x /tmp/ovr-platform-util
          file /tmp/ovr-platform-util
          /tmp/ovr-platform-util version

      - name: Check Meta release channels and notify Cloudflare
        env:
          META_APP_ID: "1114644571740688"
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          WORKER_URL: "https://holy-river-936a.joeswansonfam1.workers.dev/admin/build"
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          token = os.environ.get("META_USER_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing META_USER_TOKEN repository secret.")
          if not os.environ.get("ADMIN_TOKEN", "").strip():
              raise SystemExit("Missing ADMIN_TOKEN repository secret.");

          app_id = os.environ["META_APP_ID"]
          print(f"Checking Meta release channels for App ID {app_id}...")
          result = subprocess.run(
              ["/tmp/ovr-platform-util", "get-release-channel-data",
               "--app-id", app_id, "--token", token],
              check=True, capture_output=True, text=True
          )

          channels = {}
          for line in result.stdout.splitlines():
              if "|" not in line:
                  continue
              p = [x.strip() for x in line.strip().strip("|").split("|")]
              if len(p) >= 4 and p[0].lower() != "channel name" and p[1].isdigit():
                  channels[p[1]] = {
                      "channelName": p[0], "channelId": p[1],
                      "versionCode": p[2], "versionName": p[3]
                  }

          if not channels:
              print("Meta CLI output (no token is printed):")
              print(result.stdout[:12000])
              raise SystemExit("Could not parse release-channel data; no notification sent and state was not changed.")

          print(f"Meta returned {len(channels)} release channel(s):")
          for channel in channels.values():
              print(f"- {channel['channelName']}: versionCode={channel['versionCode']}, versionName={channel['versionName']}")

          path = Path("state/release-channels.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          old_state = json.loads(path.read_text()) if path.exists() else None

          if old_state is None:
              print("BASELINE: First successful check. Saving the baseline without sending a notification.")
              summary_lines = ["## Meta Quest build check", "First successful check: saved the baseline; no POST was sent."]
          else:
              changes = []
              for channel_id, current in channels.items():
                  old = old_state.get(channel_id)
                  if old and (old.get("versionCode"), old.get("versionName")) == (current["versionCode"], current["versionName"]):
                      print(f"UNCHANGED: {current['channelName']} remains at {current['versionCode']} ({current['versionName']}).")
                      continue

                  payload = {
                      "version": str(current["versionName"] or current["versionCode"]),
                      "buildId": str(current["versionCode"]),
                      "channel": str(current["channelName"]),
                      "releaseNotes": "",
                      "event": "meta_quest_release_channel_updated",
                      "appId": app_id,
                      **current,
                      "previousVersionCode": old.get("versionCode") if old else None,
                      "previousVersionName": old.get("versionName") if old else None,
                      "detectedAt": datetime.now(timezone.utc).isoformat()
                  }
                  req = urllib.request.Request(
                      os.environ["WORKER_URL"],
                      data=json.dumps(payload).encode(),
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + os.environ.get("ADMIN_TOKEN", ""),
                          "User-Agent": "MetaBuildDetector/1.0 (+https://github.com/cwazmaz/meta-build-detect)"
                      },
                      method="POST"
                  )
                  print(f"CHANGE DETECTED: {current['channelName']}; POSTing to Cloudflare...")
                  with urllib.request.urlopen(req, timeout=30) as response:
                      response_body = response.read().decode("utf-8", errors="replace")
                      if not 200 <= response.status < 300:
                          raise RuntimeError(f"Cloudflare Worker returned HTTP {response.status}: {response_body[:1000]}")
                      print(f"POST SUCCESS: HTTP {response.status}; response: {response_body[:1000]}")
                  changes.append(current["channelName"])

              if changes:
                  summary_lines = ["## Meta Quest build check", "POST sent successfully for: " + ", ".join(changes)]
              else:
                  print("NO CHANGES: All recorded release-channel versions are unchanged; no POST sent.")
                  summary_lines = ["## Meta Quest build check", "No release-channel version changes detected; no POST sent."]

          path.write_text(json.dumps(channels, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(summary_lines) + "\n")
          PY

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/release-channels.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Meta release channel state"
            git push
            echo "Saved updated release-channel state."
          else
            echo "No state changes to commit."
          fi
